ransform:translateX(0)}.top{height:60px;padding:0 12px;gap:10px}.mobilebrand{display:block;flex:1}.mobilebrand{display:flex;align-items:center;gap:9px;min-width:0;max-width:100%;overflow:hidden}.mobilebrand img{width:105px;height:42px;object-fit:contain}.mobilebrand img.idealbrand{width:105px!important;height:42px!important;max-width:105px!important;max-height:42px!important;min-width:105px;object-fit:contain;flex:0 0 105px}.mobilelogout{display:inline-block;padding:8px 10px;font-size:12px}.menutoggle{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:#eaf6fb;color:var(--b);font-size:21px;width:40px;height:40px}.content{padding:15px 11px}.head{gap:9px;margin-bottom:14px}.head h1{font-size:21px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:13px;border-radius:12px}.stat strong{font-size:23px}.formgrid{grid-template-columns:1fr}.actions{flex-wrap:wrap}.actions .btn{flex:1;min-width:120px}.tablewrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{min-width:600px}th,td{padding:10px 8px}.toolbar input{max-width:none;width:100%}.login{padding:14px}.loginbox{padding:23px 19px}}@media(min-width:801px){.menutoggle{display:none}}

<script>
const SUPABASE_URL='https://riqzlhmqloexkpyonzyl.supabase.co';
// Replace this placeholder with your Supabase Settings → API Keys → Publishable key (sb_publishable_...).
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_uLM-ob0yIAwD1qdKuBf2sA_-43YvYZ6';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);let currentUser=null,profile=null,currentModule='dashboard',records=[],schema={};
const defs={
'Students':{table:'students',cols:['id','profile_id','admission_number','date_of_birth','gender','address','admission_date','is_active'],write:['profile_id','admission_number','date_of_birth','gender','address','admission_date','is_active']},
'Teachers':{table:'teachers',cols:['id','profile_id','employee_code','joining_date','is_active'],write:['profile_id','employee_code','joining_date','is_active']},
'Classes & Batches':{table:'classes',cols:['id','class_name','batch_name','academic_year','description'],write:['class_name','batch_name','academic_year','description']},
'Subjects':{table:'subjects',cols:['id','subject_name','description'],write:['subject_name','description']},
'Attendance':{table:'attendance',cols:['id','student_id','class_id','attendance_date','status','marked_by','remarks'],write:['student_id','class_id','attendance_date','status','marked_by','remarks']},
'Timetable':{table:'timetable',cols:['id','class_id','subject_id','teacher_id','day_of_week','start_time'],write:['class_id','subject_id','teacher_id','day_of_week','start_time']},
'Homework':{table:'assignments',cols:['id','class_id','subject_id','teacher_id','title','instructions','due_date','attachment_url'],write:['class_id','subject_id','teacher_id','title','instructions','due_date','attachment_url']},
'Submissions':{table:'submissions',cols:['id','assignment_id','student_id','submission_text','attachment_url','submitted_at','marks','teacher_feedback'],write:['assignment_id','student_id','submission_text','attachment_url','marks','teacher_feedback']},
'Exams':{table:'exams',cols:['id','class_id','subject_id','exam_name','exam_date','maximum_marks'],write:['class_id','subject_id','exam_name','exam_date','maximum_marks']},
'Results':{table:'results',cols:['id','exam_id','student_id','marks_obtained','teacher_remarks','is_published'],write:['exam_id','student_id','marks_obtained','teacher_remarks','is_published']},
'Announcements':{table:'announcements',cols:['id','title','message','target_role','class_id','created_by','created_at'],write:['title','message','target_role','class_id','created_by']},
'Study Materials':{table:'study_materials',cols:['id','class_id','subject_id','title','description','file_url','uploaded_by'],write:['class_id','subject_id','title','description','file_url','uploaded_by']}
};
const access={
administrator:['Dashboard','Students','Teachers','Classes & Batches','Subjects','Attendance','Timetable','Homework','Submissions','Exams','Results','Study Materials','Announcements'],
teacher:['Dashboard','My Classes','Student List','Attendance','Timetable','Homework','Submissions','Exams','Results','Study Materials','Announcements'],

parent:['Dashboard','My Children','Attendance','Timetable','Homework','Results','Announcements']
};
function msg(text,bad=false){$('message').textContent=text;$('message').classList.remove('hidden','error');if(bad)$('message').classList.add('error')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function boot(){if(SUPABASE_PUBLISHABLE_KEY.includes('PASTE_')){$('loginMsg').textContent='Add your Supabase publishable key in this file before signing in.';$('loginMsg').classList.remove('hidden');return}const {data:{session}}=await db.auth.getSession();if(session)await loadProfile(session.user);else showLogin()}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}
async function loadProfile(user){currentUser=user;let {data,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error||!data){showLogin();$('loginMsg').textContent=error?.message||'Your profile is not set up yet. Ask the administrator.';$('loginMsg').classList.remove('hidden');return}profile=data;const role=String(data.role||'').toLowerCase();if(!access[role]){showLogin();$('loginMsg').textContent='This account has no recognised portal role.';$('loginMsg').classList.remove('hidden');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=(data.full_name||user.email)+' · '+role;$('userLabel').textContent=data.full_name||user.email;buildNav();await openModule('Dashboard')}
function buildNav(){ $('nav').innerHTML='';access[profile.role.toLowerCase()].forEach((name,i)=>{let b=document.createElement('button');b.textContent=(i===0?'▦  ':'•  ')+name;b.onclick=()=>{openModule(name);closeMobileMenu()};b.dataset.name=name;$('nav').appendChild(b)})}
function moduleDef(name){if(name==='My Classes')return defs['Classes & Batches'];if(name==='Student List')return defs.Students;if(name==='My Profile')return {table:'profiles',cols:['id','full_name','role','phone','preferred_language'],write:[]};if(name==='My Children')return {table:'students',cols:['id','admission_number','date_of_birth','gender','is_active'],write:[]};return defs[name]||null}
async function openModule(name){currentModule=name;$('crumb').textContent=name;$('title').textContent=name==='Dashboard'?'Welcome, '+(profile.full_name||'')+' 👋':name;$('subtitle').textContent='ZEST IDEAL · '+profile.role;$('sectionTitle').textContent=name==='Dashboard'?'Institute overview':name;$('sectionDesc').textContent='Live records available to your account.';$('formPanel').classList.add('hidden');$('message').classList.add('hidden');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.name===name));$('addBtn').classList.add('hidden');$('search').classList.add('hidden');if(name==='Dashboard'){await dashboard();return}let d=moduleDef(name);if(!d){$('dataArea').innerHTML='<p class="muted">This section is not included in the current database tables yet.</p>';return}await loadTable(d,name)}
async function dashboard(){let names=profile.role.toLowerCase()==='administrator'?['students','teachers','classes','attendance']:profile.role.toLowerCase()==='teacher'?['classes','students','assignments','submissions']:profile.role.toLowerCase()==='student'?['attendance','assignments','results','study_materials']:['students','attendance','results','announcements'];let labels={students:'Students',teachers:'Teachers',classes:'Classes',attendance:'Attendance',assignments:'Homework',submissions:'Submissions',results:'Results',study_materials:'Study materials',announcements:'Announcements'};let out=[];for(let t of names){let {count,error}=await db.from(t).select('*',{count:'exact',head:true});out.push({label:labels[t]||t,value:error?'—':count??0})}$('stats').innerHTML=out.map(x=>`<div class="card stat"><small>${esc(x.label)}</small><strong>${esc(x.value)}</strong><small>Live database count</small></div>`).join('');$('dataArea').innerHTML='<div class="notice">Your portal is connected. Choose a section from the navigation to view its records. Data shown here is retrieved from Supabase and follows your account permissions.</div>'}
async function loadTable(d,name){$('dataArea').innerHTML='<p class="muted">Loading records…</p>';let {data,error}=await db.from(d.table).select(d.cols.join(',')).limit(100);if(error){$('dataArea').innerHTML=`<div class="notice error">${esc(error.message)}</div>`;return}records=data||[];let cols=d.cols.filter(c=>c!=='id'&&c!=='profile_id'&&c!=='created_by'&&c!=='marked_by'&&c!=='uploaded_by');$('search').classList.remove('hidden');$('search').value='';$('search').oninput=()=>drawRows(cols);drawRows(cols);let canWrite=d.write.length&&(['administrator','teacher'].includes(profile.role.toLowerCase()))&&!(profile.role.toLowerCase()==='teacher'&&['Students','Student List','My Classes'].includes(name));$('addBtn').classList.toggle('hidden',!canWrite);$('addBtn').textContent=name==='Students'?'＋ Register Student':'＋ Add';$('addBtn').onclick=()=>name==='Students'?showStudentRegistration():showForm(d,name)}
async function showStudentRegistration(){
  $('formPanel').classList.remove('hidden');
  $('formTitle').textContent='Register New Student';
  $('formFields').innerHTML='<div class="notice" style="grid-column:1/-1">Enter the student details. An account invitation will be sent to the email address provided.</div>'+
    '<div><label>Student Full Name *</label><input name="full_name" type="text" required maxlength="120" placeholder="Full name"></div>'+
    '<div><label>Student Email *</label><input name="email" type="email" required maxlength="254" placeholder="student@example.com"></div>'+
    '<div><label>Admission Number *</label><input name="admission_number" type="text" required maxlength="60" placeholder="Admission number"></div>'+
    '<div><label>Phone Number</label><input name="phone" type="tel" maxlength="30" placeholder="Phone number"></div>'+
    '<div><label>Date of Birth</label><input name="date_of_birth" type="date"></div>'+
    '<div><label>Gender</label><select name="gender"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div>'+
    '<div><label>Admission Date</label><input name="admission_date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
    '<div><label>Class / Batch (Optional)</label><select name="class_id" id="registrationClass"><option value="">No class selected</option></select></div>'+
    '<div style="grid-column:1/-1"><label>Address</label><textarea name="address" rows="2" placeholder="Student address"></textarea></div>';
  const classSelect=$('registrationClass');
  const {data:classes,error:classError}=await db.from('classes').select('id,class_name,batch_name,academic_year').order('class_name');
  if(classError){classSelect.innerHTML='<option value="">Classes could not be loaded</option>';}
  else (classes||[]).forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=[c.class_name,c.batch_name,c.academic_year].filter(Boolean).join(' · ');classSelect.appendChild(o)});
  $('recordForm').onsubmit=async e=>{
    e.preventDefault();
    const form=e.currentTarget,button=form.querySelector('button[type="submit"]');
    const payload=Object.fromEntries(new FormData(form).entries());
    if(!payload.class_id)delete payload.class_id;
    button.disabled=true;button.textContent='Registering…';
    try{
      const {data:sessionData,error:sessionError}=await db.auth.getSession();
      if(sessionError||!sessionData.session)throw new Error('Your session has expired. Please sign in again.');
      const response=await fetch(SUPABASE_URL+'/functions/v1/create-student',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+sessionData.session.access_token},
        body:JSON.stringify(payload)
      });
      const result=await response.json().catch(()=>({error:'Unexpected server response.'}));
      if(!response.ok||!result.success)throw new Error(result.error||'Student registration failed.');
      $('formPanel').classList.add('hidden');
      msg('Student registered successfully. Invitation email sent.');
      await loadTable(defs.Students,'Students');
    }catch(err){msg(err.message||'Student registration failed.',true);}
    finally{button.disabled=false;button.textContent='Save';}
  };
}
function drawRows(cols){let q=$('search').value.toLowerCase();let list=records.filter(r=>JSON.stringify(r).toLowerCase().includes(q));if(!list.length){$('dataArea').innerHTML='<p class="muted">No records found, or your account does not have access yet.</p>';return}$('dataArea').innerHTML='<table><thead><tr>'+cols.map(c=>`<th>${esc(c.replaceAll('_',' '))}</th>`).join('')+'</tr></thead><tbody>'+list.map(r=>'<tr>'+cols.map(c=>`<td>${esc(r[c])}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}
function showForm(d,name){$('formPanel').classList.remove('hidden');$('formTitle').textContent='Add '+name;$('formFields').innerHTML=d.write.map(c=>{let type=(c.includes('date')?'date':c.includes('time')?'time':c==='is_active'||c==='is_published'?'checkbox':c==='maximum_marks'||c==='marks'||c==='marks_obtained'||c==='day_of_week'?'number':'text');let val=c==='created_by'||c==='marked_by'||c==='uploaded_by'?currentUser.id:'';let field=c==='class_name'?'<select name="class_name" required><option value="">Select Class</option>'+['6','7','8','9','10'].map(v=>'<option value="'+v+'">'+v+'</option>').join('')+'</select>':c==='batch_name'?'<select name="batch_name" required><option value="">Select Batch</option>'+['Alpha','Gamma','Beta','Delta','Epsilon','Zeta'].map(v=>'<option value="'+v+'">'+v+'</option>').join('')+'</select>':type==='checkbox'?'<input name="'+c+'" type="checkbox" '+(c==='is_active'||c==='is_published'?'checked':'')+'>':'<input name="'+c+'" type="'+type+'" '+(type==='number'?'step="any"':'')+' value="'+esc(val)+'" '+(['title','subject_name','exam_name','attendance_date','student_id','class_id'].includes(c)?'required':'')+'>';return '<div><label>'+esc(c.replaceAll('_',' '))+(type==='checkbox'?'':' *')+'</label>'+field+'</div>'}).join('');$('recordForm').onsubmit=async e=>{e.preventDefault();let payload={};new FormData(e.target).forEach((v,k)=>payload[k]=v);d.write.filter(c=>['is_active','is_published'].includes(c)).forEach(c=>payload[c]=e.target.elements[c].checked);['created_by','marked_by','uploaded_by'].forEach(c=>{if(d.write.includes(c))payload[c]=currentUser.id});Object.keys(payload).forEach(k=>{if(payload[k]==='')payload[k]=null});let {error}=await db.from(d.table).insert(payload);if(error){msg(error.message,true)}else{$('formPanel').classList.add('hidden');msg('Record saved successfully.');await loadTable(d,name)}}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').classList.add('hidden');let {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;$('loginMsg').classList.remove('hidden')}else await loadProfile(data.user)};
const signOut=async()=>{await db.auth.signOut();profile=null;showLogin()};$('menuToggle').onclick=()=>{let opened=$('sidebar').classList.toggle('open');$('sidebarBackdrop').classList.toggle('show',opened);$('menuToggle').setAttribute('aria-expanded',String(opened))};const closeMobileMenu=()=>{$('sidebar').classList.remove('open');$('sidebarBackdrop').classList.remove('show');$('menuToggle').setAttribute('aria-expanded','false')};$('menuClose').onclick=closeMobileMenu;$('sidebarBackdrop').onclick=closeMobileMenu;$('logout').onclick=signOut;$('logoutMobile').onclick=signOut;$('refresh').onclick=()=>openModule(currentModule);$('cancelForm').onclick=()=>$('formPanel').classList.add('hidden');db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showLogin()});boot();
</script></body></html>
